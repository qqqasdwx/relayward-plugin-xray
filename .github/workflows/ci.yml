name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
        working-directory: ui
      - run: npm run typecheck
        working-directory: ui
      - run: npm run lint
        working-directory: ui
      - run: npm test
        working-directory: ui
      - run: go test ./...
      - run: go test -race ./...
      - run: go vet ./...
      - run: shellcheck scripts/build-release.sh
      - run: ./scripts/build-release.sh 0.0.0-ci /tmp/relayward-plugin-xray-release
      - run: cd /tmp/relayward-plugin-xray-release && sha256sum -c SHA256SUMS
  official-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - uses: actions/cache@v6
        id: xray
        with:
          path: /tmp/official-xray
          key: official-xray-linux-amd64-26.7.28
      - if: steps.xray.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/official-xray
          curl -fL --retry 2 https://github.com/XTLS/Xray-core/releases/download/v26.7.28/Xray-linux-64.zip -o /tmp/official-xray/xray.zip
          unzip -q /tmp/official-xray/xray.zip -d /tmp/official-xray
          chmod +x /tmp/official-xray/xray
      - run: go test ./internal/xrayruntime -run '^TestOfficialXrayAccessAndLoggerRotation$' -count=1 -timeout=30s
        env:
          XRAY_INTEGRATION_BINARY: /tmp/official-xray/xray
